<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>駅ナカ南壁</title><link rel="stylesheet" href="style.css?v=17"></head><body><button id="reloadGuests" class="reroll" aria-label="妖怪を入れ替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-5v5h5M4 13a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></svg><span>リロード</span></button><video id="camera" autoplay muted playsinline hidden></video><main><section class="stage"><canvas id="view" aria-label="鬼と撮影するカメラ"></canvas><div id="welcome" style="display:none"><button id="start">カメラを開く</button></div><span id="timer" hidden>● 00:00</span></section><div id="status" role="status" aria-live="polite"></div><section class="controls"><div class="modes"><button class="active" data-mode="photo">写真</button><button data-mode="video">動画</button></div><div class="shutter-row"><button id="flip" class="round camera-switch" aria-label="内カメラに切り替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><path d="M9 11a4 4 0 0 1 6 1m0-3v3h-3m3 4a4 4 0 0 1-6-1m0 3v-3h3"/></svg><span class="switch-label">内カメ</span></button><button id="shutter" aria-label="写真を撮る"><span></span></button><button id="motion" class="round" aria-label="動きを止める">Ⅱ</button></div><div hidden><input id="size" type="range" min="20" max="100" value="80"><input id="speed" type="range" min="70" max="300" value="170"></div></section></main><dialog id="result"><div class="result-head"><h2>プレビュー</h2><button id="close" class="round" aria-label="閉じる">×</button></div><div id="media"></div><p></p><button id="share">共有・保存</button><a id="download" download>ダウンロード ↓</a></dialog><script src="camera-source.js"></script><script src="yokai.js?v=19"></script><script src="app.js?v=17"></script></body></html>

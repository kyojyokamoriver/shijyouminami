<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20251e"><title>駅ナカ南壁｜内カメラ</title><link rel="stylesheet" href="../style.css?v=17"><style>
[hidden]{display:none!important}#cam,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}#cam{object-fit:contain;background:#20251e}body.front #cam,body.front #gl{transform:scaleX(-1)}#gl{touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#status{position:absolute}#rec{position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;display:none;background:#eb4f60dd;padding:7px 11px;border-radius:14px;color:#fff;font-size:12px}#rec.on{display:block}#rec i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:white}#modes button[aria-pressed=true]{background:#ffffff25;border-color:#ffffff80}#shutter b{display:block;width:100%;height:100%;border-radius:50%;background:white}body.video #shutter b{background:#f45f68}body.recording #shutter b{border-radius:8px;transform:scale(.55)}#pause svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}#retryCamera{position:fixed;bottom:220px;left:50%;transform:translateX(-50%);border-radius:24px;padding:12px 20px;background:white;color:#222;z-index:4}.sheet{position:fixed;inset:0;z-index:5;background:#172515dd;display:grid;place-items:center;padding:24px}.sheet .inner{max-width:440px;width:100%;background:#f7f3e9;color:#303a2c;padding:22px;border-radius:25px}.media img,.media video{width:100%;max-height:60dvh;object-fit:contain;border-radius:15px}.btns{display:flex;gap:10px;justify-content:center;margin-top:16px}.primary,.ghost{border-radius:24px;padding:13px 20px;background:#263523;color:white}.ghost{background:#ddd;color:#222}.note{font-size:12px;text-align:center}
</style></head><body><button id="reloadGuests" class="reroll" aria-label="妖怪を入れ替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-5v5h5M4 13a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></svg><span>リロード</span></button><video id="cam" playsinline muted autoplay></video><canvas id="gl" aria-label="頭に鬼が乗る自撮りカメラ"></canvas><div id="ui"><div id="status" role="status" aria-live="polite"></div><div id="rec"><i></i><span id="recTime">0:00</span></div><span id="hint" hidden></span><section class="controls"><div class="modes" id="modes" role="group" aria-label="撮影モード"><button id="modePhoto" aria-pressed="true">写真</button><button id="modeVideo" aria-pressed="false">動画</button></div><div id="row" class="shutter-row"><button class="round camera-switch" id="flip" aria-label="外カメラに切り替える"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><path d="M9 11a4 4 0 0 1 6 1m0-3v3h-3m3 4a4 4 0 0 1-6-1m0 3v-3h3"/></svg><span class="switch-label">外カメ</span></button><button id="shutter" aria-label="撮影"><b></b></button><button id="pause" class="round" aria-label="動きを止める"><svg id="pauseIco" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button></div></section></div><button id="recall" hidden></button><button id="retryCamera" hidden>カメラをもう一度開く</button><div id="flash" hidden></div><div id="result" class="sheet" role="dialog" aria-label="撮影プレビュー" hidden><div class="inner"><div class="media" id="resultMedia"></div><div class="btns"><button class="primary" id="shareBtn">保存・共有</button><button class="ghost" id="closeBtn">閉じる</button></div><p class="note" id="resultNote"></p></div></div><script src="../camera-source.js"></script><script type="module" src="app.js?v=18"></script></body></html>
